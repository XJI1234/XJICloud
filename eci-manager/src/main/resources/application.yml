server:
  port: 8081

spring:
  application:
    name: eci-manager
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:h2:file:./data/eci-manager;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

eci:
  mock: true
  api-key: ${ECI_API_KEY:dev-eci-api-key-change-me}
  region-id: ${ECI_REGION_ID:cn-hangzhou}
  vpc-id: ${ECI_VPC_ID:}
  vswitch-id: ${ECI_VSWITCH_ID:}
  security-group-id: ${ECI_SECURITY_GROUP_ID:}
  access-key-id: ${ECI_ACCESS_KEY_ID:}
  access-key-secret: ${ECI_ACCESS_KEY_SECRET:}
  default-image: nginx:alpine
  default-cpu: 1.0
  default-memory: 2.0
  # 空=不挂 EmptyDir，保留 ECI 默认 64Mi /dev/shm；可设 256Mi 等（须小于容器 memory）
  default-shm-size: ${ECI_DEFAULT_SHM_SIZE:}
  create-timeout-sec: ${ECI_CREATE_TIMEOUT_SEC:300}
  delete-timeout-sec: 300
  poll-interval-ms: 3000
  default-restart-policy: Never
  default-max-runtime-sec: 14400
  task-poll-interval-sec: 10
  lifecycle-action:
    dispatch-interval-ms: 1000
    batch-size: 20
    lease-sec: 60
    retry-initial-sec: 2
    retry-max-sec: 300
    cleanup-alert-attempts: 5
  # Mock：创建后 N 秒自动迁终态（Succeeded/Failed）；<=0 仅 simulateStatus 钩子
  mock-auto-complete-sec: 3
  mock-auto-complete-status: Succeeded
  # 失败/超时：删实例前抓容器日志尾部行数；宽限秒数（0=立即删）
  failure-log-tail-lines: ${ECI_FAILURE_LOG_TAIL_LINES:1000}
  failure-log-grace-sec: ${ECI_FAILURE_LOG_GRACE_SEC:90}
  console:
    open-browser: ${ECI_CONSOLE_OPEN_BROWSER:true}
  oss:
    enabled: ${ECI_OSS_ENABLED:false}
    endpoint: ${ECI_OSS_ENDPOINT:}
    region: ${ECI_OSS_REGION:}
    bucket: ${ECI_OSS_BUCKET:}
    access-key: ${ECI_OSS_ACCESS_KEY:}
    secret-key: ${ECI_OSS_SECRET_KEY:}
    path-style-access: ${ECI_OSS_PATH_STYLE_ACCESS:false}
    presign-expiration-minutes: ${ECI_OSS_PRESIGN_EXPIRATION_MINUTES:60}

logging:
  level:
    com.xjicloud.eci: INFO
