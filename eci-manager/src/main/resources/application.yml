server:
  port: 8081

spring:
  application:
    name: eci-manager
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:h2:file:./data/eci-manager;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

eci:
  mock: true
  api-key: ${ECI_API_KEY:dev-eci-api-key-change-me}
  region-id: ${ECI_REGION_ID:cn-hangzhou}
  vpc-id: ${ECI_VPC_ID:}
  vswitch-id: ${ECI_VSWITCH_ID:}
  security-group-id: ${ECI_SECURITY_GROUP_ID:}
  access-key-id: ${ECI_ACCESS_KEY_ID:}
  access-key-secret: ${ECI_ACCESS_KEY_SECRET:}
  default-image: nginx:alpine
  default-cpu: 1.0
  default-memory: 2.0
  create-timeout-sec: 300
  delete-timeout-sec: 300
  poll-interval-ms: 3000
  default-restart-policy: Never
  default-max-runtime-sec: 14400
  task-poll-interval-sec: 10
  # Mock：创建后 N 秒自动迁终态（Succeeded/Failed）；<=0 仅 simulateStatus 钩子
  mock-auto-complete-sec: 3
  mock-auto-complete-status: Succeeded

logging:
  level:
    com.xjicloud.eci: INFO
