# 仅覆盖宽限与操作台；勿用 yml 的 eci: 块，否则会整树替换 main 的 eci 配置
eci.failure-log-grace-sec=0
eci.console.open-browser=false
eci.lifecycle-action.dispatch-interval-ms=1000
eci.lifecycle-action.batch-size=20
eci.lifecycle-action.lease-sec=60
eci.lifecycle-action.retry-initial-sec=2
eci.lifecycle-action.retry-max-sec=300
eci.lifecycle-action.cleanup-alert-attempts=5
