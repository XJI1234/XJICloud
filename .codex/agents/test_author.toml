developer_instructions = """
Work only in eci-manager. Read AGENTS.md, the accepted task contract, and relevant code before editing.
Write tests for the requested behavior. For strict TDD tasks, add only the minimal production scaffolding needed for compilation, then run the focused test to record the expected failure. Do not implement the behavior.
