spring:
  profiles:
    active: dev
  application:
    name: xjicloud-backend
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  tomcat:
    connection-timeout: 3600000
    max-swallow-size: -1

xjicloud:
  jwt:
    secret: change-me-in-production-use-at-least-32-chars-long-secret-key
    # Admin JWT TTL. User JWT is 7 days (JwtService.USER_EXPIRATION_MS). Worker JWT is this value × 7.
    expiration-ms: 86400000
  storage:
    root: ./data/xjicloud
  cors:
    allowed-origins: http://127.0.0.1:5174,http://localhost:5174
  eci-manager:
    base-url: ${XJICLOUD_ECI_MANAGER_BASE_URL:http://127.0.0.1:8081}
    api-key: ${XJICLOUD_ECI_MANAGER_API_KEY:}
    connect-timeout: ${XJICLOUD_ECI_MANAGER_CONNECT_TIMEOUT:3s}
    read-timeout: ${XJICLOUD_ECI_MANAGER_READ_TIMEOUT:20s}
    training-image: ${XJICLOUD_ECI_MANAGER_TRAINING_IMAGE:}
    dispatch-delay-ms: ${XJICLOUD_ECI_MANAGER_DISPATCH_DELAY_MS:1000}
    recovery-delay-ms: ${XJICLOUD_ECI_MANAGER_RECOVERY_DELAY_MS:30000}
    poll-delay-ms: ${XJICLOUD_ECI_MANAGER_POLL_DELAY_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/xjicloud-db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://localhost:5432/xjicloud
    username: xjicloud
    password: xjicloud
  jpa:
    hibernate:
      ddl-auto: validate
