spring:
  profiles:
    active: dev
  application:
    name: xjicloud-backend
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  tomcat:
    connection-timeout: 3600000
    max-swallow-size: -1

xjicloud:
  jwt:
    secret: change-me-in-production-use-at-least-32-chars-long-secret-key
    # Admin JWT TTL. User JWT is 7 days (JwtService.USER_EXPIRATION_MS). Worker JWT is this value × 7.
    expiration-ms: 86400000
  storage:
    root: ./data/xjicloud
  cors:
    allowed-origins: http://127.0.0.1:5176,http://localhost:5176,http://127.0.0.1:5175,http://localhost:5175,http://127.0.0.1:5174,http://localhost:5174

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/xjicloud-db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
xjicloud:
  admin:
    default-username: admin
    default-password: admin123
    sync-password-on-startup: false
  oss:
    endpoint: http://127.0.0.1:9000
    region: us-east-1
    bucket: xjicloud
    access-key: minioadmin
    secret-key: minioadmin
    path-style-access: true
    presign-expiration-minutes: 60
  worker:
    shared-secret: change-me-worker-secret-in-production

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://localhost:5432/xjicloud
    username: xjicloud
    password: xjicloud
  jpa:
    hibernate:
      ddl-auto: validate
